<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数组排序可视化程序</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 50px;
            background-color: #222;
            color: #fff;
        }

        h1 {
            margin-top: 20px;
        }

        .bar {
            width: 30px;
            margin: 0 5px;
            background-color: #448855;
            transition: height 0.5s ease,
                background-color 0.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bar-value {
            font-size: 12px;
            color: #000;
            margin-bottom: 5px;
        }

        .code-container {
            width: 800px;
            overflow: auto;
            font-family: monospace;
            background-color: #f0f0f0;
            padding: 10px;
            border: 1px solid #ccc;
        }

        .chart-container {
            width: 800px;
            height: 400px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
            background-color: #333;
        }

        .code-line {
            position: absolute;
            padding: 2px 0;
            background-color: #ccc;
        }

        .code-highlight {
            background-color: #ff6b6b;
        }

        #chart {
            display: flex;
            align-items: flex-end;
            height: 400px;
            padding: 10px;
            gap: 5px;
        }

        .bar .highlight {
            background: #ff6b6b;
        }

        .array-wrapper {
            border: 2px solid #666;
            padding: 20px;
            margin: 20px 0;
            overflow: hidden;
            background-color: #444;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .btn:hover {
            background-color: #666;
        }

        .custom-input {
            padding: 10px;
            font-size: 16px;
            width: 300px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #333;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            color: white;
        }

        .modal-content input {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            width: 250px;
            background-color: #444;
            color: white;
            border: 1px solid #666;
        }

        .modal-content button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .modal-content button:hover {
            background-color: #666;
        }

        .code-wrapper {
            position: relative;
            border: 2px solid #666;
            padding: 20px;
            margin-top: 20px;
            background-color: #444;
            width: 400px;
            min-height: 200px;
        }

        .code-wrapper h3 {
            position: absolute;
            top: 10px;
            left: 15px;
            margin: 0;
            font-size: 18px;
            color: #aaa;
        }

        .code-content {
            margin-top: 30px;
            font-family: monospace;
            color: #fff;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h1>数组排序可视化</h1>

    <div class="array-wrapper">
        <div class="chart-container" id="chart"></div>
    </div>

    <div class="btn-container">
        <button class="btn" onclick="resetArray()">重置数组</button>
        <button class="btn" onclick="openCustomModal()">自定义数组</button>
    </div>

    <div class="code-wrapper">
        <h3>排序代码区</h3>
        <div class="code-content" id="codeContent"></div>
    </div>

    <div class="modal" id="customModal">
        <div class="modal-content">
            <h3>请输入自定义数组</h3>
            <p>输入数字，用逗号分隔（如：0.2,0.5,0.1）</p>
            <input type="text" id="customArrayInput" placeholder="例如：0.2,0.5,0.1,0.9">
            <br>
            <button onclick="applyCustomArray()">确定</button>
            <button onclick="closeCustomModal()">取消</button>
        </div>
    </div>

    <div id="code-line"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
</body>
<script>
    let fakeNewsScores = [13, 4, 56, 40, 27, 75, 26, 89];

    function renderArray(arr) {
        const chart = document.getElementById('chart');
        chart.innerHTML = '';
        arr.forEach(score => {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = `0px`;

            const valueLabel = document.createElement('div');
            valueLabel.className = 'bar-value';
            valueLabel.textContent = score;

            bar.appendChild(valueLabel);
            chart.appendChild(bar);
        });

        const maxValue = Math.max(...arr);
        const scale = 360 / maxValue;
        const bars = document.querySelectorAll('.bar');

        bars.forEach((bar, i) => {
            bar.style.height = `${arr[i] * scale}px`;
            bar.classList.add('highlight');
        });
    }

    function fakeNewsSorting(arr) {
        if (arr.length <= 1) {
            return arr;
        }
        const report = [arr[0]];
        let bestsofar = arr[0];
        for (let i = 1; i < arr.length; i++) {
            if (arr[i] > bestsofar) {
                report.push(arr[i]);
                bestsofar = arr[i];
            } else {
                bestsofar += 0.1;
                report.push(bestsofar);
            }
        }
        return report;
    }

    function generateRandomArray() {
        const arr = [];
        for (let i = 0; i < 9; i++) {
            arr.push(Math.floor(Math.random() * 100) + 1);
        }
        return arr;
    }

    function resetArray() {
        fakeNewsScores = generateRandomArray();
        renderArray(fakeNewsScores);
    }

    function openCustomModal() {
        document.getElementById('customModal').classList.add('active');
        document.getElementById('customArrayInput').value = fakeNewsScores.join(',');
    }

    function closeCustomModal() {
        document.getElementById('customModal').classList.remove('active');
    }

    function applyCustomArray() {
        const input = document.getElementById('customArrayInput').value;
        const arr = input.split(',').map(num => parseFloat(num.trim())).filter(num => !isNaN(num));
        if (arr.length > 0) {
            fakeNewsScores = arr;
            renderArray(fakeNewsScores);
        }
        closeCustomModal();
    }

    renderArray(fakeNewsScores);
</script>

</html>
