<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数组排序可视化程序</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 50px;
            background-color: #222;
            color: #fff;
        }

        h1 {
            margin-top: 20px;
        }

        .bar {
            width: 30px;
            margin: 0 5px;
            background-color: #448855;
            transition: height 0.5s ease,
                background-color 0.5s ease,
                transform 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .bar-value {
            font-size: 12px;
            color: #000;
            margin-bottom: 5px;
        }

        .code-container {
            width: 800px;
            overflow: auto;
            font-family: monospace;
            background-color: #f0f0f0;
            padding: 10px;
            border: 1px solid #ccc;
        }

        .chart-container {
            width: 800px;
            height: 400px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            position: relative;
            background-color: #333;
            overflow-x: auto;
        }

        .code-line {
            position: absolute;
            padding: 2px 0;
            background-color: #ccc;
        }

        .code-highlight {
            background-color: #ff6b6b;
        }

        #chart {
            display: flex;
            align-items: flex-end;
            height: 400px;
            padding: 10px;
            gap: 5px;
        }

        .bar .highlight {
            background: #ff6b6b;
        }

        .array-wrapper {
            border: 2px solid #666;
            padding: 20px;
            margin: 20px 0;
            overflow: hidden;
            background-color: #444;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .btn:hover {
            background-color: #666;
        }

        .custom-input {
            padding: 10px;
            font-size: 16px;
            width: 300px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #333;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            color: white;
        }

        .modal-content input {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            width: 250px;
            background-color: #444;
            color: white;
            border: 1px solid #666;
        }

        .modal-content button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .modal-content button:hover {
            background-color: #666;
        }

        .code-wrapper {
            position: relative;
            border: 2px solid #666;
            padding: 20px;
            margin-top: 20px;
            background-color: #444;
            width: 400px;
            min-height: 200px;
        }

        .code-wrapper h3 {
            position: absolute;
            top: 10px;
            left: 15px;
            margin: 0;
            font-size: 18px;
            color: #aaa;
        }

        .code-content {
            margin-top: 30px;
            font-family: monospace;
            color: #fff;
            white-space: pre-wrap;
        }

        .sort-buttons-container {
            position: absolute;
            left: 480px;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sort-btn {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 4px;
            width: 120px;
        }

        .sort-btn:hover {
            background-color: #777;
        }
    </style>
</head>

<body>
    <h1>数组排序可视化</h1>

    <div class="array-wrapper">
        <div class="chart-container" id="chart"></div>
    </div>

    <div class="btn-container">
        <button class="btn" onclick="resetArray()">数组置零</button>
        <button class="btn" onclick="generateRandomArrayBtn()">随机数组</button>
        <button class="btn" onclick="openCustomModal()">自定义数组</button>
    </div>

    <div class="code-wrapper">
        <h3>排序代码区</h3>
        <textarea id="sortCodeInput" class="custom-input" rows="8" placeholder="// 请在这里写排序算法（下面是冒泡排序示例）&#10;// 提示：你操作的数组名字叫 arr&#10;for(let i = 0; i &lt; arr.length; i++) {&#10;    for(let j = 0; j &lt; arr.length - i - 1; j++) {&#10;        if(arr[j] &gt; arr[j+1]) {&#10;            let temp = arr[j];&#10;            arr[j] = arr[j+1];&#10;            arr[j+1] = temp;&#10;        }&#10;    }&#10;}" style="width: 100%; box-sizing: border-box; font-family: monospace; background-color: #444; color: #fff; border: 1px solid #666; margin-top: 40px;"></textarea>
        <br>
        <button class="btn" onclick="executeSortCode()">执行排序</button>

        <div class="sort-buttons-container">
            <button class="sort-btn" onclick="insertSortCode('bubble')">冒泡排序</button>
            <button class="sort-btn" onclick="insertSortCode('selection')">选择排序</button>
            <button class="sort-btn" onclick="insertSortCode('insertion')">插入排序</button>
            <button class="sort-btn" onclick="insertSortCode('quick')">快速排序</button>
        </div>

    </div>

    <div class="modal" id="customModal">
        <div class="modal-content">
            <h3>请设置数组数量</h3>
            <input type="number" id="arrayCountInput" placeholder="请输入数组数量" min="1" max="20">
            <br>
            <button onclick="generateArrayInputs()">确定数量</button>
            <button onclick="closeCustomModal()">取消</button>
            
            <div id="arrayInputsContainer" style="display: none; margin-top: 20px;">
                <h4>请输入数组元素</h4>
                <div id="arrayInputs" style="max-height: 250px; overflow-y: auto; margin: 10px 0;"></div>
                <button onclick="applyCustomArray()">确定</button>
            </div>
        </div>
    </div>

    <div id="code-line"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
    <div class="code-line code-highlight"></div>
</body>
<script>
    let paix = [13, 4, 56, 40, 27, 75, 26, 89];//初始数组

    function renderArray(arr) {
        const chart = document.getElementById('chart');
        chart.innerHTML = '';
        arr.forEach(score => {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = `0px`;

            const valueLabel = document.createElement('div');
            valueLabel.className = 'bar-value';
            valueLabel.textContent = score;

            bar.appendChild(valueLabel);
            chart.appendChild(bar);
        });

        const maxValue = Math.max(...arr);
        const scale = 360 / maxValue;
        const bars = document.querySelectorAll('.bar');

        bars.forEach((bar, i) => {
            bar.style.height = `${arr[i] * scale}px`;
            bar.classList.add('highlight');
        });
    }

    function fakeNewsSorting(arr) {
    // 冒泡排序算法实现
    if (arr.length <= 1) {
        return arr;
    }
    const report = [arr[0]];
    let bestsofar = arr[0];
    for (let i = 1; i < arr.length; i++) {
        if (arr[i] > bestsofar) {
            report.push(arr[i]);
            bestsofar = arr[i];
        } else {
            bestsofar += 0.1;
            report.push(bestsofar);
        }
    }
    return report;
}

    function generateRandomArray() {
        const arr = [];
        for (let i = 0; i < 9; i++) {
            arr.push(Math.floor(Math.random() * 100) + 1);
        }
        return arr;
    }

    function resetArray() {
        paix = paix.map(() => 0);
        renderArray(paix);
    }

    function generateRandomArrayBtn() {
        paix = generateRandomArray();
        renderArray(paix);
    }

    async function executeSortCode() {
        const code = document.getElementById('sortCodeInput').value;
        if (!code.trim()) {
            alert('请输入排序代码');
            return;
        }

        const arrCopy = [...paix];
        const actionQueue = [];
        let lastState = [...arrCopy];
        
        const trackedArray = new Proxy(arrCopy, {
            set(target, index, value) {
                if (!isNaN(index)) {
                    const idx = Number(index);
                    if (lastState[idx] !== value) {
                        const sourceIndex = lastState.indexOf(value);
                        if (sourceIndex !== -1 && sourceIndex !== idx) {
                            actionQueue.push({ 
                                type: 'swap', 
                                from: sourceIndex, 
                                to: idx 
                            });
                        }
                        lastState[idx] = value;
                    }
                }
                target[index] = value;
                return true;
            }
        });
        
        try {
            const sortFunction = new Function('arr', code);
            sortFunction(trackedArray);
        } catch (error) {
            alert("你的代码里好像有语法错误：\n" + error.message);
            return;
        }
        
        const bars = document.querySelectorAll('.bar');
        
        for (let i = 0; i < actionQueue.length; i++) {
            const action = actionQueue[i];
            
            if (action.type === 'swap') {
                const bar1 = bars[action.from];
                const bar2 = bars[action.to];
                
                bar1.style.backgroundColor = '#FF5252';
                bar2.style.backgroundColor = '#FF5252';
                
                await sleep(200);
                
                const rect1 = bar1.getBoundingClientRect();
                const rect2 = bar2.getBoundingClientRect();
                const distance = rect2.left - rect1.left;
                
                bar1.style.transition = 'transform 0.5s ease';
                bar2.style.transition = 'transform 0.5s ease';
                
                bar1.style.transform = `translateX(${distance}px)`;
                bar2.style.transform = `translateX(-${distance}px)`;
                bar1.style.zIndex = 10;
                bar2.style.zIndex = 10;
                
                await sleep(600);
                
                const tempBar = bars[action.from];
                bars[action.from] = bars[action.to];
                bars[action.to] = tempBar;
                
                const tempValue = bar1.querySelector('.bar-value').textContent;
                const tempHeight = bar1.style.height;
                
                bar1.querySelector('.bar-value').textContent = bar2.querySelector('.bar-value').textContent;
                bar1.style.height = bar2.style.height;
                
                bar2.querySelector('.bar-value').textContent = tempValue;
                bar2.style.height = tempHeight;
                
                bar1.style.transform = '';
                bar2.style.transform = '';
                bar1.style.zIndex = 1;
                bar2.style.zIndex = 1;
                
                bar1.style.backgroundColor = '#448855';
                bar2.style.backgroundColor = '#448855';
                
                bar1.style.transition = 'height 0.5s ease, background-color 0.5s ease, transform 0.4s ease';
                bar2.style.transition = 'height 0.5s ease, background-color 0.5s ease, transform 0.4s ease';
                
                await sleep(200);
            }
        }
        
        paix = arrCopy;
        
        const finalBars = document.querySelectorAll('.bar');
        for (let i = 0; i < finalBars.length; i++) {
            finalBars[i].style.backgroundColor = '#0000ff';
            await sleep(200);
        }
        
        for (let i = 0; i < finalBars.length; i++) {
            finalBars[i].style.backgroundColor = '#448855';
            await sleep(200);
        }
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function insertSortCode(type) {
        const codeTemplates = {
            bubble: `// 冒泡排序
for(let i = 0; i < arr.length; i++) {
    for(let j = 0; j < arr.length - i - 1; j++) {
        if(arr[j] > arr[j+1]) {
            let temp = arr[j];
            arr[j] = arr[j+1];
            arr[j+1] = temp;
        }
    }
}`,
            selection: `// 选择排序
for(let i = 0; i < arr.length - 1; i++) {
    let minIndex = i;
    for(let j = i + 1; j < arr.length; j++) {
        if(arr[j] < arr[minIndex]) {
            minIndex = j;
        }
    }
    let temp = arr[i];
    arr[i] = arr[minIndex];
    arr[minIndex] = temp;
}`,
            insertion: `// 插入排序
for(let i = 1; i < arr.length; i++) {
    let key = arr[i];
    let j = i - 1;
    while(j >= 0 && arr[j] > key) {
        arr[j + 1] = arr[j];
        j--;
    }
    arr[j + 1] = key;
}`,
            quick: `// 快速排序
function quickSort(arr, left, right) {
    if(left < right) {
        let pivot = arr[right];
        let i = left - 1;
        for(let j = left; j < right; j++) {
            if(arr[j] <= pivot) {
                i++;
                let temp = arr[i];
                arr[i] = arr[j];
                arr[j] = temp;
            }
        }
        let temp = arr[i + 1];
        arr[i + 1] = arr[right];
        arr[right] = temp;
        let pi = i + 1;
        quickSort(arr, left, pi - 1);
        quickSort(arr, pi + 1, right);
    }
}
quickSort(arr, 0, arr.length - 1);`
        };
        document.getElementById('sortCodeInput').value = codeTemplates[type];
    }

    function openCustomModal() {
        const bars = document.querySelectorAll('.bar');
        bars.forEach(bar => {
            bar.style.zIndex = '1';
            bar.style.transform = '';
        });
        
        document.getElementById('customModal').classList.add('active');
        document.getElementById('arrayCountInput').value = '';
        document.getElementById('arrayInputsContainer').style.display = 'none';
        document.getElementById('arrayInputs').innerHTML = '';
    }

    function closeCustomModal() {
        document.getElementById('customModal').classList.remove('active');
    }

    function generateArrayInputs() {
        const count = parseInt(document.getElementById('arrayCountInput').value);
        if (isNaN(count) || count < 1 || count > 50) {
            alert('请输入1-50之间的有效数字');
            return;
        }
        
        const container = document.getElementById('arrayInputs');
        container.innerHTML = '';
        
        for (let i = 1; i <= count; i++) {
            const inputWrapper = document.createElement('div');
            inputWrapper.style.margin = '10px 0';
            
            const label = document.createElement('span');
            label.textContent = `第 ${i} 个元素：`;
            
            const input = document.createElement('input');
            input.type = 'number';
            input.id = `arrayElement_${i}`;
            input.placeholder = `请输入第 ${i} 个数字`;
            input.style.width = '200px';
            input.style.marginLeft = '10px';
            input.style.padding = '8px';
            input.style.backgroundColor = '#444';
            input.style.color = 'white';
            input.style.border = '1px solid #666';
            
            inputWrapper.appendChild(label);
            inputWrapper.appendChild(input);
            container.appendChild(inputWrapper);
        }
        
        document.getElementById('arrayInputsContainer').style.display = 'block';
    }

    function applyCustomArray() {
        const inputs = document.querySelectorAll('#arrayInputs input');
        const arr = [];
        
        inputs.forEach((input) => {
            const value = parseFloat(input.value.trim());
            if (!isNaN(value)) {
                arr.push(value);
            }
        });
        
        if (arr.length > 0) {
            paix = arr;
            renderArray(paix);
        } else {
            alert('请至少输入一个有效数字');
            return;
        }
        closeCustomModal();
    }

    renderArray(paix);
</script>

</html>
